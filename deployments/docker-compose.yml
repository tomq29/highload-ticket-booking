name: highload

services:
  app:
    build:
      context: ..
      dockerfile: dockerfile
    ports:
      - '8080:8080'
    environment:
      - DATABASE_URL=postgres://test:test@db:5432/highload-tickets?sslmode=disable
    depends_on:
      - db

  db:
    image: postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: highload-tickets
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test

