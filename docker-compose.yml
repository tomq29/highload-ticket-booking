name: booking

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgres://booking:booking@db:5432/booking?sslmode=disable
      DB_MAX_CONNS: "${DB_MAX_CONNS:-20}"
      HOLD_TTL: "${HOLD_TTL:-10m}"
      BOOKING_STRATEGY: "${BOOKING_STRATEGY:-pessimistic}"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/api", "-healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 15

  prometheus:
    image: prom/prometheus:v3.7.3
    profiles: ["obs"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:12.3.1
    profiles: ["obs"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

  k6:
    image: grafana/k6:1.4.0
    profiles: ["load"]
    volumes:
      - ./loadtest:/scripts:ro
    environment:
      API_URL: http://api:8080
      VUS: "${VUS:-50}"
      DURATION: "${DURATION:-30s}"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
